apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiinferenceservices.inference.ai
spec:
  group: inference.ai
  names:
    kind: AIInferenceService
    listKind: AIInferenceServiceList
    plural: aiinferenceservices
    shortNames:
    - aiisvc
    singular: aiinferenceservice
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Replicas
      type: integer
      jsonPath: .status.replicas
    - name: ReadyReplicas
      type: integer
      jsonPath: .status.readyReplicas
    - name: Endpoint
      type: string
      jsonPath: .status.endpoint
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - image
            properties:
              image:
                type: string
                minLength: 1
              replicas:
                type: integer
                format: int32
                minimum: 0
              port:
                type: integer
                format: int32
                minimum: 1
                maximum: 65535
              serviceType:
                type: string
                enum:
                - ClusterIP
                - NodePort
                - LoadBalancer
                - ExternalName
              command:
                type: array
                items:
                  type: string
              args:
                type: array
                items:
                  type: string
              env:
                type: array
                x-kubernetes-preserve-unknown-fields: true
                items:
                  type: object
              resources:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              model:
                type: object
                properties:
                  uri:
                    type: string
                  mountPath:
                    type: string
              volumes:
                type: array
                x-kubernetes-preserve-unknown-fields: true
                items:
                  type: object
              volumeMounts:
                type: array
                x-kubernetes-preserve-unknown-fields: true
                items:
                  type: object
              podLabels:
                type: object
                additionalProperties:
                  type: string
              podAnnotations:
                type: object
                additionalProperties:
                  type: string
              nodeSelector:
                type: object
                additionalProperties:
                  type: string
              tolerations:
                type: array
                x-kubernetes-preserve-unknown-fields: true
                items:
                  type: object
              affinity:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              runtimeClassName:
                type: string
              imagePullSecrets:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
              autoscaling:
                type: object
                properties:
                  minReplicas:
                    type: integer
                    format: int32
                    minimum: 1
                  maxReplicas:
                    type: integer
                    format: int32
                    minimum: 1
                  targetCPUUtilizationPercentage:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 100
                  targetMemoryAverageUtilization:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 100
                  behavior:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              ingress:
                type: object
                properties:
                  enabled:
                    type: boolean
                  host:
                    type: string
                  path:
                    type: string
                  className:
                    type: string
                  tlsSecretName:
                    type: string
                  annotations:
                    type: object
                    additionalProperties:
                      type: string
              accelerator:
                type: object
                properties:
                  resourceName:
                    type: string
                  count:
                    x-kubernetes-int-or-string: true
                    anyOf:
                    - type: integer
                    - type: string
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              replicas:
                type: integer
                format: int32
              readyReplicas:
                type: integer
                format: int32
              endpoint:
                type: string
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
