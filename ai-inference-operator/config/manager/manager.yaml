apiVersion: v1
kind: Namespace
metadata:
  name: ai-inference-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-operator-controller-manager
  namespace: ai-inference-operator-system
  labels:
    app.kubernetes.io/name: ai-inference-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-inference-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-inference-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: ai-inference-operator-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: controller
        imagePullPolicy: Always
        args:
        - --leader-elect
        command:
        - /manager
        ports:
        - containerPort: 8081
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
